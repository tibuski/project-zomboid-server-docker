services:
  zomboid:
    image: ghcr.io/tibuski/project-zomboid-server-docker:latest
    container_name: project-zomboid
    restart: unless-stopped
    stop_grace_period: 120s
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    env_file:
      - .env
    volumes:
      - ./data:/home/steam/Zomboid
      - ./server-files:/home/steam/pzserver
      - ./backups:/home/steam/Zomboid/backups

  # Watches the Discord channel for "restart server" and recreates the
  # zomboid service on the latest image. Idles until DISCORD_BOT_TOKEN and
  # DISCORD_CHANNEL_ID are set in .env - see docs/DISCORD.md.
  discordbot:
    image: ghcr.io/tibuski/project-zomboid-server-docker/discordbot:latest
    build:
      context: .
      dockerfile: Dockerfile.discordbot
    container_name: project-zomboid-discordbot
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      # The project directory must sit at the same absolute path inside the
      # sidecar as on the host, otherwise compose resolves the ./data etc.
      # bind mounts to paths that do not exist on the host.
      COMPOSE_DIR: ${COMPOSE_PROJECT_DIR:-${PWD}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_PROJECT_DIR:-${PWD}}:${COMPOSE_PROJECT_DIR:-${PWD}}:ro
